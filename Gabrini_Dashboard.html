<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabrini — Dashboard Andamento</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
  --page: #29588c; --surface-1: #fcfcfb;
  --ink-1: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --gray-a: #898781; --gray-b: #c3c2b7;
  --good: #006300; --bad: #d03b3b;
  --accent-soft: #86b6ef;
  background: var(--page); color: var(--ink-1);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) body {
    color-scheme: dark;
    --page: #11253c; --surface-1: #1a2f47;
    --ink-1: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2f4560; --axis: #3e5877;
    --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --gray-a: #898781; --gray-b: #52514e;
    --good: #0ca30c; --bad: #d03b3b;
    --accent-soft: #1c5cab;
  }
}
:root[data-theme="dark"] body {
  color-scheme: dark;
  --page: #11253c; --surface-1: #1a2f47;
  --ink-1: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2f4560; --axis: #3e5877;
  --border: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --gray-a: #898781; --gray-b: #52514e;
  --good: #0ca30c; --bad: #d03b3b;
  --accent-soft: #1c5cab;
}

.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 24px 64px; }
header.top {
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  padding: 14px 0 6px;
}
header.top h1 { font-size: 21px; font-weight: 650; letter-spacing: -0.01em; }
header.top .period { font-size: 13px; color: var(--ink-2); }
header.top .spacer { flex: 1; }
#themeBtn {
  font: inherit; font-size: 12.5px; color: var(--ink-2);
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
#themeBtn:hover { color: var(--ink-1); }

nav.tabs { display: flex; gap: 4px; margin: 14px 0 22px; border-bottom: 1px solid var(--grid); flex-wrap: wrap; }
nav.tabs button {
  font: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink-2);
  background: none; border: none; border-bottom: 2px solid transparent;
  padding: 9px 14px 10px; cursor: pointer; margin-bottom: -1px;
}
nav.tabs button:hover { color: var(--ink-1); }
nav.tabs button[aria-selected="true"] { color: var(--ink-1); font-weight: 600; border-bottom-color: var(--s1); }
section.tabpane { display: none; }
section.tabpane.active { display: block; }

.grid { display: grid; gap: 16px; }
.grid > * { min-width: 0; }
.grid.kpis { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 16px; }
.grid.two { grid-template-columns: 1fr 1fr; }
.grid.hero-row { grid-template-columns: minmax(300px, 1.15fr) 2fr; align-items: stretch; }
.grid.hero-row .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 560px) { .grid.hero-row .kpis { grid-template-columns: 1fr; } }
@media (max-width: 880px) { .grid.two, .grid.hero-row { grid-template-columns: 1fr; } }

.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px 20px;
}
.card h3 { font-size: 14px; font-weight: 600; letter-spacing: 0.01em; }
.card .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.card .chead { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
.card .chead > div:first-child { flex: 1; }
.tblBtn {
  font: inherit; font-size: 11.5px; color: var(--muted); background: none;
  border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; cursor: pointer;
  white-space: nowrap;
}
.tblBtn:hover { color: var(--ink-1); }
.chartbox { position: relative; }
.chartbox svg { display: block; width: 100%; height: auto; }

/* stat tiles */
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 15px 18px; }
.tile .lbl { font-size: 12px; color: var(--ink-2); }
.tile .val { font-size: 24px; font-weight: 600; margin-top: 5px; letter-spacing: -0.01em; }
.tile .delta { font-size: 12px; margin-top: 5px; color: var(--ink-2); }
.tile .delta .dn, .delta .dn { color: var(--bad); font-weight: 600; }
.tile .delta .up, .delta .up { color: var(--good); font-weight: 600; }
.hero { display: flex; flex-direction: column; justify-content: center; }
.hero .lbl { font-size: 13px; color: var(--ink-2); }
.hero .val { font-size: 52px; font-weight: 650; letter-spacing: -0.02em; margin: 8px 0 4px; }
.hero .delta { font-size: 13.5px; color: var(--ink-2); }

/* legend */
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 2px 0 12px; font-size: 12px; color: var(--ink-2); }
.legend .li { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend .ln { width: 16px; height: 2px; border-radius: 1px; display: inline-block; }

/* chips */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.chips button {
  font: inherit; font-size: 12.5px; color: var(--ink-2); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 999px; padding: 5px 13px; cursor: pointer;
}
.chips button:hover { color: var(--ink-1); }
.chips button[aria-pressed="true"] { color: var(--ink-1); font-weight: 600; border-color: var(--s1); box-shadow: inset 0 0 0 1px var(--s1); }

/* tooltip */
#tip {
  position: fixed; z-index: 50; pointer-events: none; display: none;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 11px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.13);
  max-width: 280px;
}
#tip .t { font-weight: 600; color: var(--ink-2); font-size: 11.5px; margin-bottom: 4px; }
#tip .row { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
#tip .k { width: 14px; height: 2.5px; border-radius: 1px; flex: none; }
#tip .nm { color: var(--ink-2); flex: 1; }
#tip .v { font-weight: 650; color: var(--ink-1); font-variant-numeric: tabular-nums; margin-left: 8px; }

/* tables */
.tblwrap { overflow-x: auto; }
table.dv { border-collapse: collapse; width: 100%; font-size: 12px; }
table.dv th, table.dv td { padding: 6px 10px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.dv th { color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--grid); }
table.dv td:first-child, table.dv th:first-child { text-align: left; position: sticky; left: 0; background: var(--surface-1); }
table.dv tr:not(:last-child) td { border-bottom: 1px solid var(--grid); }
table.dv td.neg { color: var(--bad); }
table.dv tr.strong td { font-weight: 650; }

.note { font-size: 11.5px; color: var(--muted); margin-top: 26px; }
.sectionTitle { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 26px 0 12px; text-transform: uppercase; letter-spacing: 0.06em; }
.sectionTitle:first-child { margin-top: 0; }
/* --- brand: elementi sullo sfondo blu Gabrini --- */
header.top { align-items: center; }
header.top h1 { display: flex; align-items: center; gap: 12px; color: #fff; }
.logoMark { height: 46px; width: auto; display: block; }
.logoWord { height: 30px; width: auto; display: block; margin-top: 4px; }
.hsub { font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.85); border-left: 1px solid rgba(255,255,255,0.35); padding-left: 12px; }
header.top .period { color: rgba(255,255,255,0.75); }
nav.tabs { border-bottom-color: rgba(255,255,255,0.30); }
nav.tabs button { color: rgba(255,255,255,0.72); }
nav.tabs button:hover { color: #fff; }
nav.tabs button[aria-selected="true"] { color: #fff; border-bottom-color: #d7a95a; }
.chips button[aria-pressed="true"] { border-color: #d7a95a; box-shadow: inset 0 0 0 1px #d7a95a; }
.sectionTitle { color: rgba(255,255,255,0.85); }
.note { color: rgba(255,255,255,0.68); }
#themeBtn { border-color: rgba(255,255,255,0.25); }
.warn {
  display: flex; gap: 10px; align-items: flex-start;
  background: rgba(215,169,90,0.16); border: 1px solid #d7a95a;
  color: #fff; border-radius: 10px; padding: 10px 14px;
  font-size: 12.5px; line-height: 1.45; margin-bottom: 14px;
}
.warn .wi { flex: none; font-size: 14px; }
.warn b { color: #ecc98a; }
/* --- recensioni --- */
.rev-li { border-left: 3px solid var(--good); padding-left: 12px; margin-bottom: 12px; }
.rev-li.neg { border-left-color: var(--bad); }
.rev-li.warn2 { border-left-color: #d7a95a; }
.rev-li .rt { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
.rev-li .rd { font-size: 11.5px; color: var(--ink-2); line-height: 1.55; }
.quote { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 13px 16px; }
.quote .qh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
.quote .stars { color: #d7a95a; font-size: 12px; letter-spacing: 1px; }
.quote .qm { font-size: 11px; color: var(--muted); }
.quote .qt { font-size: 12.5px; line-height: 1.55; font-style: italic; }
.quote .qs { font-size: 11px; color: var(--ink-2); margin-top: 6px; }
.sentdots { color: #d7a95a; letter-spacing: 1px; white-space: nowrap; }
.searchBox {
  font: inherit; font-size: 13px; color: var(--ink-1);
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; width: 100%; max-width: 340px;
  outline: none;
}
.searchBox::placeholder { color: var(--muted); }
.searchBox:focus { border-color: #d7a95a; box-shadow: 0 0 0 2px rgba(215,169,90,0.25); }
</style>
</head>

const MESI = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];

const $ = s => document.querySelector(s);

const eur0 = new Intl.NumberFormat('it-IT', {maximumFractionDigits: 0});
function fmtEur(v){ return (v < 0 ? '−' : '') + '€ ' + eur0.format(Math.abs(Math.round(v))); }
function fmtEurS(v){ // compact for axes/labels
  const a = Math.abs(v);
  if (a >= 1e6) return (v/1e6).toLocaleString('it-IT',{maximumFractionDigits:1}) + ' M';
  if (a >= 1e3) return Math.round(v/1e3).toLocaleString('it-IT') + ' k';
  return eur0.format(Math.round(v));
}
function fmtPct(v, dec=1){ return (v*100).toLocaleString('it-IT',{maximumFractionDigits:dec, minimumFractionDigits:0}) + '%'; }
function fmtDelta(v){ return (v>0?'+':'') + fmtPct(v); }
function svgEl(tag, attrs){ const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function niceTicks(min, max, n=5){
  if (min > 0) min = 0; if (max < 0) max = 0;
  const span = max - min || 1;
  const step0 = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  let step = mag;
  for (const m of [1,2,2.5,5,10]) { if (step0 <= m*mag) { step = m*mag; break; } }
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step;
  const ticks = []; for (let t = lo; t <= hi + step*0.001; t += step) ticks.push(Math.round(t*100)/100);
  return {lo, hi, ticks};
}
const tip = $('#tip');
function showTip(x, y, html){ tip.innerHTML = ''; tip.appendChild(html); tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  let px = x + 14, py = y + 14;
  if (px + r.width > innerWidth - 8) px = x - r.width - 14;
  if (py + r.height > innerHeight - 8) py = y - r.height - 14;
  tip.style.left = px + 'px'; tip.style.top = py + 'px';
}
function hideTip(){ tip.style.display = 'none'; }
function tipContent(title, rows){
  const f = document.createDocumentFragment();
  const t = document.createElement('div'); t.className = 't'; t.textContent = title; f.appendChild(t);
  rows.forEach(([color, name, val]) => {
    const r = document.createElement('div'); r.className = 'row';
    const k = document.createElement('span'); k.className = 'k'; k.style.background = color; r.appendChild(k);
    const n = document.createElement('span'); n.className = 'nm'; n.textContent = name; r.appendChild(n);
    const v = document.createElement('span'); v.className = 'v'; v.textContent = val; r.appendChild(v);
    f.appendChild(r);
  });
  return f;
}

/* rounded-at-data-end bar path (square at baseline) */
function barPath(x, yBase, w, val, y0, r){
  // val>=0: top rounded; val<0: bottom rounded. yBase = y(value), y0 = y(0)
  const top = Math.min(yBase, y0), bot = Math.max(yBase, y0), h = Math.max(bot - top, 0.5);
  r = Math.min(r, w/2, h);
  if (yBase <= y0) { // grows up
    return `M ${x} ${bot} L ${x} ${top+r} Q ${x} ${top} ${x+r} ${top} L ${x+w-r} ${top} Q ${x+w} ${top} ${x+w} ${top+r} L ${x+w} ${bot} Z`;
  } else { // grows down
    return `M ${x} ${top} L ${x+w} ${top} L ${x+w} ${bot-r} Q ${x+w} ${bot} ${x+w-r} ${bot} L ${x+r} ${bot} Q ${x} ${bot} ${x} ${bot-r} Z`;
  }
}

/* ---------- LINE CHART ---------- */
function lineChart(el, cfg){
  function render(){

    const {lo, hi, ticks} = niceTicks(Math.min(...vals), Math.max(...vals), 5);
    const x = i => m.l + (labels.length === 1 ? 0.5 : i/(labels.length-1)) * (W - m.l - m.r);
    const y = v => m.t + (1 - (v - lo)/(hi - lo)) * (H - m.t - m.b);
    ticks.forEach(t => {
      svg.appendChild(svgEl('line', {x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: t === 0 ? css('--axis') : css('--grid'), 'stroke-width': 1}));
      const tx = svgEl('text', {x: m.l - 8, y: y(t) + 3.5, 'text-anchor': 'end', 'font-size': 10.5, fill: css('--muted'), style: 'font-variant-numeric: tabular-nums'});
      tx.textContent = fmtEurS(t); svg.appendChild(tx);
    });
    labels.forEach((lb, i) => {
      if (labels.length > 14 && i % 2 === 1) return;
      const tx = svgEl('text', {x: x(i), y: H - 8, 'text-anchor': 'middle', 'font-size': 10.5, fill: css('--muted')});
      tx.textContent = lb; svg.appendChild(tx);
    });
    cfg.series.forEach(s => {
      let d = '', started = false;
      s.values.forEach((v, i) => { if (v == null) return; d += (started ? ' L ' : 'M ') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); started = true; });
      svg.appendChild(svgEl('path', {d, fill: 'none', stroke: s.color(), 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'}));
      // end marker + direct label
      let li = s.values.length - 1; while (li >= 0 && s.values[li] == null) li--;
      if (li >= 0) {
        svg.appendChild(svgEl('circle', {cx: x(li), cy: y(s.values[li]), r: 4, fill: s.color(), stroke: css('--surface-1'), 'stroke-width': 2}));
      }
    });

    const cross = svgEl('line', {y1: m.t, y2: H - m.b, stroke: css('--axis'), 'stroke-width': 1, visibility: 'hidden'});
    svg.appendChild(cross);
    const overlay = svgEl('rect', {x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: 'transparent'});
    overlay.addEventListener('pointermove', ev => {
      const pt = svg.getBoundingClientRect();
      const px = ev.clientX - pt.left;

      labels.forEach((_, i) => { const d = Math.abs(x(i) - px); if (d < bd) { bd = d; best = i; } });

}

/* ---------- BAR CHART (vertical, single or grouped) ---------- */
function barChart(el, cfg){
  function render(){
    el.innerHTML = '';
    const W = el.clientWidth || 500, H = cfg.height || 260;
    const m = {t: cfg.topPad || 20, r: 12, b: 26, l: 52};
    const svg = svgEl('svg', {viewBox: `0 0 ${W} ${H}`, width: W, height: H});
    const labels = cfg.labels, nS = cfg.series.length;
    let vals = [];
    cfg.series.forEach(s => s.values.forEach(v => { if (v != null) vals.push(v); }));
    const {lo, hi, ticks} = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals), 5);
    const y = v => m.t + (1 - (v - lo)/(hi - lo)) * (H - m.t - m.b);
    const plotW = W - m.l - m.r, band = plotW / labels.length;
    const gap = 2, thick = Math.min(24, (band - 8 - gap*(nS-1)) / nS);
    const groupW = thick*nS + gap*(nS-1);
    ticks.forEach(t => {
      svg.appendChild(svgEl('line', {x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: t === 0 ? css('--axis') : css('--grid'), 'stroke-width': 1}));
      const tx = svgEl('text', {x: m.l - 8, y: y(t) + 3.5, 'text-anchor': 'end', 'font-size': 10.5, fill: css('--muted'), style: 'font-variant-numeric: tabular-nums'});
      tx.textContent = fmtEurS(t); svg.appendChild(tx);
    });
    const labelEvery = Math.ceil(labels.length / 16);
    labels.forEach((lb, i) => {
      if (i % labelEvery !== 0) return;
      const cx = m.l + band*i + band/2;
      const tx = svgEl('text', {x: cx, y: H - 8, 'text-anchor': 'middle', 'font-size': 10.5, fill: css('--muted')});
      tx.textContent = lb; svg.appendChild(tx);
    });
    labels.forEach((lb, i) => {
      const gx = m.l + band*i + (band - groupW)/2;
      cfg.series.forEach((s, si) => {
        const v = s.values[i]; if (v == null) return;
        const bx = gx + si*(thick+gap);
        const fill = s.colors ? s.colors[i]() : s.color();
        svg.appendChild(svgEl('path', {d: barPath(bx, y(v), thick, v, y(0), 4), fill}));
      });
      // hit area per band
      const hit = svgEl('rect', {x: m.l + band*i, y: m.t, width: band, height: H - m.t - m.b, fill: 'transparent'});
      hit.addEventListener('pointermove', ev => {
        const rows = cfg.series.filter(s => s.values[i] != null).map(s => [(s.colors ? s.colors[i]() : s.color()), s.name, cfg.fmt ? cfg.fmt(s.values[i]) : fmtEur(s.values[i])]);
        showTip(ev.clientX, ev.clientY, tipContent(cfg.tipTitle ? cfg.tipTitle(i) : lb, rows));
      });
      hit.addEventListener('pointerleave', hideTip);
      svg.appendChild(hit);
    });
    // selective direct labels
    (cfg.directLabels || []).forEach(([i, si, txt]) => {
      const gx = m.l + band*i + (band - groupW)/2 + si*(thick+gap) + thick/2;
      const v = cfg.series[si].values[i];
      const above = v >= 0;
      const tx = svgEl('text', {x: gx, y: y(v) + (above ? -6 : 12), 'text-anchor': 'middle', 'font-size': 10.5, 'font-weight': 600, fill: css('--ink-2'), style: 'font-variant-numeric: tabular-nums'});
      tx.textContent = txt; svg.appendChild(tx);
    });
    el.appendChild(svg);
  }
  register(el, render); render();
}

/* ---------- STACKED BAR ---------- */
function stackedBar(el, cfg){
  function render(){
    el.innerHTML = '';
    const W = el.clientWidth || 500, H = cfg.height || 280;
    const m = {t: 14, r: 12, b: 26, l: 52};
    const svg = svgEl('svg', {viewBox: `0 0 ${W} ${H}`, width: W, height: H});
    const labels = cfg.labels;
    const totals = labels.map((_, i) => cfg.series.reduce((a, s) => a + (s.values[i] || 0), 0));
    const {lo, hi, ticks} = niceTicks(0, Math.max(...totals), 5);
    const y = v => m.t + (1 - (v - lo)/(hi - lo)) * (H - m.t - m.b);
    const plotW = W - m.l - m.r, band = plotW / labels.length;
    const thick = Math.min(24, band - 8);
    ticks.forEach(t => {
      svg.appendChild(svgEl('line', {x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: t === 0 ? css('--axis') : css('--grid'), 'stroke-width': 1}));
      const tx = svgEl('text', {x: m.l - 8, y: y(t) + 3.5, 'text-anchor': 'end', 'font-size': 10.5, fill: css('--muted'), style: 'font-variant-numeric: tabular-nums'});
      tx.textContent = fmtEurS(t); svg.appendChild(tx);
    });
    const labelEvery = Math.ceil(labels.length / 16);
    labels.forEach((lb, i) => {
      if (i % labelEvery !== 0) return;
      const tx = svgEl('text', {x: m.l + band*i + band/2, y: H - 8, 'text-anchor': 'middle', 'font-size': 10.5, fill: css('--muted')});
      tx.textContent = lb; svg.appendChild(tx);
    });
    labels.forEach((lb, i) => {
      const bx = m.l + band*i + (band - thick)/2;
      let acc = 0;
      cfg.series.forEach((s, si) => {
        const v = s.values[i] || 0; if (v <= 0) { acc += v; return; }
        const yTop = y(acc + v), yBot = y(acc) - (acc > 0 ? 2 : 0); // 2px surface gap above previous segment
        const h = Math.max(yBot - yTop, 0.5);
        const isTop = cfg.series.slice(si+1).every(ss => !(ss.values[i] > 0));
        if (isTop) {
          const r = Math.min(4, thick/2, h);
          svg.appendChild(svgEl('path', {d: `M ${bx} ${yBot} L ${bx} ${yTop+r} Q ${bx} ${yTop} ${bx+r} ${yTop} L ${bx+thick-r} ${yTop} Q ${bx+thick} ${yTop} ${bx+thick} ${yTop+r} L ${bx+thick} ${yBot} Z`, fill: s.color()}));
        } else {
          svg.appendChild(svgEl('rect', {x: bx, y: yTop, width: thick, height: h, fill: s.color()}));
        }
        acc += v;
      });
      const hit = svgEl('rect', {x: m.l + band*i, y: m.t, width: band, height: H - m.t - m.b, fill: 'transparent'});
      hit.addEventListener('pointermove', ev => {
        const rows = cfg.series.map(s => [s.color(), s.name, fmtEur(s.values[i] || 0)]).reverse();
        rows.unshift([css('--axis'), 'Totale', fmtEur(totals[i])]);
        showTip(ev.clientX, ev.clientY, tipContent(cfg.tipTitle ? cfg.tipTitle(i) : lb, rows));
      });
      hit.addEventListener('pointerleave', hideTip);
      svg.appendChild(hit);
    });
    el.appendChild(svg);
  }
  register(el, render); render();
}

/* ---------- HEATMAP ---------- */
const SEQ = ['#cde2fb','#b7d3f6','#9ec5f4','#86b6ef','#6da7ec','#5598e7','#3987e5','#2a78d6','#256abf','#1c5cab','#184f95','#104281','#0d366b'];
function heatmap(el, cfg){
  function render(){
    el.innerHTML = '';
    const W = el.clientWidth || 500;
    const rows = cfg.rows, cols = cfg.cols;
    const m = {t: 26, r: 10, b: 10, l: cfg.labelW || 46};
    const cellW = (W - m.l - m.r) / cols.length;
    const cellH = cfg.cellH || 34;
    const H = m.t + cellH*rows.length + m.b;
    const svg = svgEl('svg', {viewBox: `0 0 ${W} ${H}`, width: W, height: H});
    const dark = isDark();
    let vmax = 0; cfg.values.forEach(r => r.forEach(v => { if (v != null && v > vmax) vmax = v; }));
    const ramp = dark ? SEQ.slice().reverse() : SEQ;
    const colorFor = v => {
      if (v == null || vmax === 0) return 'transparent';
      const t = Math.sqrt(v / vmax);
      return ramp[Math.min(ramp.length - 1, Math.floor(t * (ramp.length - 1) + 0.5))];
    };
    cols.forEach((c, j) => {
      const tx = svgEl('text', {x: m.l + cellW*j + cellW/2, y: 16, 'text-anchor': 'middle', 'font-size': 10, fill: css('--muted')});
      tx.textContent = c; svg.appendChild(tx);
    });
    rows.forEach((rl, i) => {
      const tx = svgEl('text', {x: m.l - 8, y: m.t + cellH*i + cellH/2 + 3.5, 'text-anchor': 'end', 'font-size': 11, fill: css('--ink-2')});
      tx.textContent = rl; svg.appendChild(tx);
      cols.forEach((cl, j) => {
        const v = cfg.values[i][j];
        const rc = svgEl('rect', {x: m.l + cellW*j + 1, y: m.t + cellH*i + 1, width: cellW - 2, height: cellH - 2, rx: 3, fill: colorFor(v)});
        rc.addEventListener('pointermove', ev => {
          showTip(ev.clientX, ev.clientY, tipContent(`${rl} · ${cfg.colFull ? cfg.colFull[j] : cl}`, [[colorFor(v), cfg.metric || 'Valore', v == null ? '—' : fmtEur(v)]]));
          rc.setAttribute('stroke', css('--ink-1')); rc.setAttribute('stroke-width', 1);
        });
        rc.addEventListener('pointerleave', () => { hideTip(); rc.removeAttribute('stroke'); });
        svg.appendChild(rc);
      });
    });
    el.appendChild(svg);
  }
  register(el, render); render();
}
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark') return true;
  if (t === 'light') return false;
  return matchMedia('(prefers-color-scheme: dark)').matches;
}

      const el = mg.box;
      const Wd = el.clientWidth || 500, H = 200;
      const m = {t: 14, r: 16, b: 26, l: 44};
      const svg = svgEl('svg', {viewBox: `0 0 ${Wd} ${H}`, width: Wd, height: H});
      const vals = W.map(w => w.mpct);
      const lo = 0.7, hi = 0.9;
      const x = i => m.l + i/(W.length - 1) * (Wd - m.l - m.r);
      const y = v => m.t + (1 - (v - lo)/(hi - lo)) * (H - m.t - m.b);
      [0.7, 0.75, 0.8, 0.85, 0.9].forEach(t => {
        svg.appendChild(svgEl('line', {x1: m.l, x2: Wd - m.r, y1: y(t), y2: y(t), stroke: css('--grid'), 'stroke-width': 1}));

        tx.textContent = Math.round(t*100) + '%'; svg.appendChild(tx);
      });
      W.forEach((w, i) => {
        if (i % 2 === 0) {
          const tx = svgEl('text', {x: x(i), y: H - 8, 'text-anchor': 'middle', 'font-size': 10, fill: css('--muted')});
          tx.textContent = 'S' + w.w; svg.appendChild(tx);
        }
      });
      let d = '';
      vals.forEach((v, i) => { d += (i ? ' L ' : 'M ') + x(i).toFixed(1) + ' ' + y(Math.min(Math.max(v, lo), hi)).toFixed(1); });
      svg.appendChild(svgEl('path', {d, fill: 'none', stroke: css('--s1'), 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'}));
      const cross = svgEl('line', {y1: m.t, y2: H - m.b, stroke: css('--axis'), 'stroke-width': 1, visibility: 'hidden'});

      ov.addEventListener('pointermove', ev => {
        const pt = svg.getBoundingClientRect(); const px = ev.clientX - pt.left;
        let best = 0, bd = 1e9;
        W.forEach((_, i) => { const dd = Math.abs(x(i) - px); if (dd < bd) { bd = dd; best = i; } });
        cross.setAttribute('x1', x(best)); cross.setAttribute('x2', x(best)); cross.setAttribute('visibility', 'visible');
        showTip(ev.clientX, ev.clientY, tipContent('Settimana ' + W[best].w, [[css('--s1'), 'Margine lordo', fmtPct(W[best].mpct)], [css('--gray-a'), 'Fatturato', fmtEur(W[best].fatt)]]));
      });
      ov.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); hideTip(); });
      svg.appendChild(ov);
      el.appendChild(svg);
    }
    register(mg.box, render); render();
  })();
})();

/* ---------- DIVERGING HORIZONTAL BARS (delta) ---------- */
function dhBarChart(el, cfg){
  function render(){
    el.innerHTML = '';
    const W = el.clientWidth || 500;
    const labels = cfg.labels, vals = cfg.values;
    const rowH = cfg.rowH || 30;
    const m = {t: 6, r: 96, b: 24, l: cfg.labelW || 165};
    const H = m.t + rowH*labels.length + m.b;
    const svg = svgEl('svg', {viewBox: `0 0 ${W} ${H}`, width: W, height: H});
    const amax = Math.max(...vals.map(Math.abs));
    const {lo, hi, ticks} = niceTicks(-amax, amax, 4);
    const x = v => m.l + (v - lo)/(hi - lo) * (W - m.l - m.r);
    ticks.forEach(t => {
      svg.appendChild(svgEl('line', {x1: x(t), x2: x(t), y1: m.t, y2: H - m.b, stroke: t === 0 ? css('--axis') : css('--grid'), 'stroke-width': 1}));
      const tx = svgEl('text', {x: x(t), y: H - 8, 'text-anchor': 'middle', 'font-size': 10.5, fill: css('--muted'), style: 'font-variant-numeric: tabular-nums'});
      tx.textContent = fmtEurS(t); svg.appendChild(tx);
    });
    const thick = Math.min(18, rowH - 10);
    labels.forEach((lb, i) => {
      const cy = m.t + rowH*i + rowH/2, by = cy - thick/2;
      const tx = svgEl('text', {x: m.l - 10, y: cy + 3.5, 'text-anchor': 'end', 'font-size': 11.5, fill: css('--ink-2')});
      tx.textContent = lb.length > 22 ? lb.slice(0, 21) + '…' : lb; svg.appendChild(tx);
      const v = vals[i];
      const x0 = x(0), x1 = x(v);
      const wpx = Math.max(Math.abs(x1 - x0), 0.5);
      const fill = v >= 0 ? css('--bad') : css('--s1');
      const r = Math.min(4, thick/2, wpx);
      let d;
      if (v >= 0) d = `M ${x0} ${by} L ${x0+wpx-r} ${by} Q ${x0+wpx} ${by} ${x0+wpx} ${by+r} L ${x0+wpx} ${by+thick-r} Q ${x0+wpx} ${by+thick} ${x0+wpx-r} ${by+thick} L ${x0} ${by+thick} Z`;
      else d = `M ${x0} ${by} L ${x0-wpx+r} ${by} Q ${x0-wpx} ${by} ${x0-wpx} ${by+r} L ${x0-wpx} ${by+thick-r} Q ${x0-wpx} ${by+thick} ${x0-wpx+r} ${by+thick} L ${x0} ${by+thick} Z`;
      svg.appendChild(svgEl('path', {d, fill}));
      const lblX = v >= 0 ? x1 + 8 : x1 - 8;
      const anch = v >= 0 ? 'start' : 'end';
      const tx2 = svgEl('text', {x: lblX, y: cy + 3.5, 'text-anchor': anch, 'font-size': 11, 'font-weight': 600, fill: css('--ink-2'), style: 'font-variant-numeric: tabular-nums'});
      tx2.textContent = (v >= 0 ? '+' : '−') + fmtEurS(Math.abs(v));
      svg.appendChild(tx2);
      const hit = svgEl('rect', {x: 0, y: m.t + rowH*i, width: W, height: rowH, fill: 'transparent'});
      hit.addEventListener('pointermove', ev => showTip(ev.clientX, ev.clientY, tipContent(lb, cfg.tipRows(i))));
      hit.addEventListener('pointerleave', hideTip);
      svg.appendChild(hit);
    });
    el.appendChild(svg);
  }
  register(el, render); render();
}

/* ---------- HORIZONTAL STACKED BARS ---------- */
function hStackChart(el, cfg){
  function render(){
    el.innerHTML = '';
    const W = el.clientWidth || 500;
    const rows = cfg.rows;
    const rowH = cfg.rowH || 30;
    const m = {t: 6, r: 84, b: 24, l: cfg.labelW || 190};
    const H = m.t + rowH*rows.length + m.b;
    const svg = svgEl('svg', {viewBox: `0 0 ${W} ${H}`, width: W, height: H});
    const totals = rows.map(r => r.segs.reduce((a, s) => a + s.v, 0));
    const {lo, hi, ticks} = niceTicks(0, Math.max(...totals), 4);
    const x = v => m.l + (v - lo)/(hi - lo) * (W - m.l - m.r);
    ticks.forEach(t => {
      svg.appendChild(svgEl('line', {x1: x(t), x2: x(t), y1: m.t, y2: H - m.b, stroke: t === 0 ? css('--axis') : css('--grid'), 'stroke-width': 1}));
      const tx = svgEl('text', {x: x(t), y: H - 8, 'text-anchor': 'middle', 'font-size': 10.5, fill: css('--muted'), style: 'font-variant-numeric: tabular-nums'});
      tx.textContent = fmtEurS(t); svg.appendChild(tx);
    });
    const thick = Math.min(18, rowH - 10);
    rows.forEach((row, i) => {
      const cy = m.t + rowH*i + rowH/2, by = cy - thick/2;
      const tx = svgEl('text', {x: m.l - 10, y: cy + 3.5, 'text-anchor': 'end', 'font-size': 11.5, fill: css('--ink-2')});
      tx.textContent = row.label.length > 24 ? row.label.slice(0, 23) + '…' : row.label; svg.appendChild(tx);
      let acc = 0;
      const nz = row.segs.filter(s => s.v > 0);
      row.segs.forEach(s => {
        if (s.v <= 0) return;
        const sx = x(acc) + (acc > 0 ? 2 : 0); // 2px surface gap
        const ex = x(acc + s.v);
        const wpx = Math.max(ex - sx, 0.5);
        const isLast = s === nz[nz.length - 1];
        if (isLast) {
          const r = Math.min(4, thick/2, wpx);
          svg.appendChild(svgEl('path', {d: `M ${sx} ${by} L ${ex-r} ${by} Q ${ex} ${by} ${ex} ${by+r} L ${ex} ${by+thick-r} Q ${ex} ${by+thick} ${ex-r} ${by+thick} L ${sx} ${by+thick} Z`, fill: s.color()}));
        } else {
          svg.appendChild(svgEl('rect', {x: sx, y: by, width: wpx, height: thick, fill: s.color()}));
        }
        acc += s.v;
      });
      if (row.endLabel) {
        const tx2 = svgEl('text', {x: x(totals[i]) + 8, y: cy + 3.5, 'font-size': 11, 'font-weight': 600, fill: css('--ink-2'), style: 'font-variant-numeric: tabular-nums'});
        tx2.textContent = row.endLabel; svg.appendChild(tx2);
      }
      const hit = svgEl('rect', {x: 0, y: m.t + rowH*i, width: W, height: rowH, fill: 'transparent'});
      hit.addEventListener('pointermove', ev => showTip(ev.clientX, ev.clientY, tipContent(row.label, row.tipRows())));
      hit.addEventListener('pointerleave', hideTip);
      svg.appendChild(hit);
    });
    el.appendChild(svg);
  }
  register(el, render); render();
}

    [1, 'lug 2026', 'Google', '"Scarsa qualità, scarso servizio, scarsa scelta."', 'La recensione negativa più recente su Google.'],
    [2, 'feb 2026', 'TripAdvisor', '"Mi ha trattato con assoluto disprezzo."', 'Episodio di scortesia alla cassa/banco — il tema servizio riemerge.'],
    [2, 'nov 2025', 'TripAdvisor', '"Pizza immangiabile, girarrosto così così, i supplì di un tempo sono un lontano ricordo."', 'Tre prodotti core colpiti in una sola recensione.'],
    [2, 'set 2025', 'TripAdvisor', '"Più fumo che arrosto."', 'Sul girarrosto — percezione di sostanza inferiore alla promessa.'],
    [3, 'ago 2025', 'TripAdvisor', '"Supplì eccellenti… ma la signora alla cassa mette a disagio."', 'Prodotto promosso, accoglienza bocciata: il collo di bottiglia è l\'esperienza.'],
    [2, 'feb 2024', 'TripAdvisor', '"Una delusione! Supplì alla mozzarella… senza mozzarella."', 'Il titolo parla da solo: difetto sul prodotto-bandiera.'],
    [2, 'feb 2024', 'TripAdvisor', '"Baccalà di scarsa qualità, piuttosto scuro e molto salato. Il rapporto qualità/prezzo non è buono."', 'Qualità del fritto + percezione prezzo nella stessa recensione.'],
    [1, 'gen 2024', 'TripAdvisor', '"Incredibilmente deludente: supplì insipidi a €2,50, vitello tonnato con salsa scarsa e anonima."', 'Prezzo citato esplicitamente come aggravante.'],
    [2, 'gen 2024', 'TripAdvisor', '"Non dite che Franchi è risorto: trippa alla romana fredda, crocchette e supplì mediocri."', 'Il confronto con Franchi usato come metro di giudizio.'],
    [1, 'dic 2023', 'TripAdvisor', '"Oggi i supplì non li abbiamo fatti… che peccato! Le leggendarie rosticcerie di un tempo sono scomparse."', 'Disponibilità del prodotto atteso: il cliente arriva per il supplì e non lo trova.']
  ];
  const qgrid = document.createElement('div'); qgrid.className = 'grid two';
  QUOTES.forEach(([stars, dt, src, txt, note]) => {
    const q = document.createElement('div'); q.className = 'quote';
    const h = document.createElement('div'); h.className = 'qh';
    const s = document.createElement('span'); s.className = 'stars'; s.textContent = '★'.repeat(stars) + '☆'.repeat(5 - stars);
    const m = document.createElement('span'); m.className = 'qm'; m.textContent = dt + ' · ' + src;
    h.appendChild(s); h.appendChild(m); q.appendChild(h);
    const b = document.createElement('div'); b.className = 'qt'; b.textContent = txt; q.appendChild(b);
    const n = document.createElement('div'); n.className = 'qs'; n.textContent = note; q.appendChild(n);
    qgrid.appendChild(q);
  });
  pane.appendChild(qgrid);
  pane.appendChild(Object.assign(document.createElement('div'), {style: 'height:16px'}));

  // temi ricorrenti
  const th = document.createElement('div'); th.className = 'sectionTitle'; th.textContent = 'Temi ricorrenti nelle recensioni negative';
  pane.appendChild(th);
  const trow = document.createElement('div'); trow.className = 'grid'; trow.style.gridTemplateColumns = 'repeat(auto-fit, minmax(240px, 1fr))';
  [['🏛 Eredità Franchi', 'Il metro di giudizio è il passato: chi conosceva Franchi valuta Gabrini sul ricordo, non sull\'offerta attuale. Serve raccontare la differenza di progetto.', 'neg'],
   ['🍙 Supplì e fritti', 'Il prodotto più simbolico è il più esposto: mozzarella assente, sapore, disponibilità. Con 27 mila battute l\'impatto di ogni difetto è moltiplicato.', 'neg'],
   ['💶 Percezione prezzi', 'Supplì a €2,50, conti percepiti alti, etichetta "turistico" su Google. Il valore c\'è ma non viene sempre percepito — soprattutto dai clienti di quartiere.', 'warn2'],
   ['🛎 Cassa e accoglienza', 'Gli episodi di scortesia (ago 2025, feb 2026) generano le recensioni più dure. È l\'area con il miglior rapporto costo/beneficio di intervento.', 'warn2']].forEach(([t1, t2, cls]) => {
    const c = document.createElement('div'); c.className = 'card';
    const d = document.createElement('div'); d.className = 'rev-li ' + cls; d.style.marginBottom = '0';
    const e1 = document.createElement('div'); e1.className = 'rt'; e1.textContent = t1;
    const e2 = document.createElement('div'); e2.className = 'rd'; e2.textContent = t2;
    d.appendChild(e1); d.appendChild(e2); c.appendChild(d); trow.appendChild(c);
  });
  pane.appendChild(trow);

  const note = document.createElement('p'); note.className = 'sub';
  note.style.marginTop = '14px'; note.style.fontSize = '11.5px'; note.style.color = 'rgba(255,255,255,0.68)';
  note.textContent = 'Fonti: TripAdvisor (61 recensioni, rating 3,7/5, #54 su 152 gastronomie a Roma), Google Maps (~490 recensioni, 4,2/5, via aggregatore Trustindex), stampa di settore (Gambero Rosso, Identità Golose, RomaToday). Analisi aggiornata a luglio 2026. Le recensioni Google non sono estraibili direttamente senza accesso all\'account Business: il dettaglio Google è ricavato da aggregatori terzi.';
  pane.appendChild(note);
})();

/* ================= THEME + RESIZE ================= */
const themeBtn = $('#themeBtn');
const THEMES = ['auto', 'light', 'dark'];
let themeIdx = 0;
themeBtn.addEventListener('click', () => {
  themeIdx = (themeIdx + 1) % 3;
  const t = THEMES[themeIdx];
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = 'Tema: ' + (t === 'auto' ? 'auto' : t === 'light' ? 'chiaro' : 'scuro');
  requestAnimationFrame(renderAll);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => renderAll());
let rzT;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => renderAll(), 150); });
</script>
